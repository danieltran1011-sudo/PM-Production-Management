<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Báo cáo điều hành APIC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Sans+JP:wght@400;600&display=swap" rel="stylesheet">
<style>
/* Bảng điều hành nhà máy: thanh trên cố định, tab theo người đọc, thẻ KPI rồi bảng chi tiết. */
:root {
  --paper: #f4f6f9; --card: #ffffff; --ink: #172033; --ink-2: #4a5568; --rule: #dde3eb; --accent: #1f5fbf;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --sms: #6250d6;
  --good: #0ca30c; --warning: #c98500; --serious: #ec835a; --critical: #d03b3b;
  --ss-bg: #dce9f9; --fw-bg: #d9f2d9; --sms-bg: #e4def7; --bad-bg: #f9dcdc; --warn-bg: #fdf0d2; --heat: 42 120 214;
  --display: "IBM Plex Sans Condensed", "IBM Plex Sans", "Noto Sans JP", system-ui, sans-serif;
  --body: "IBM Plex Sans", "Noto Sans JP", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #12161d; --card: #1a2029; --ink: #e8edf4; --ink-2: #a7b2c2; --rule: #2e3745; --accent: #6ea2ec;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --sms: #9085e9;
    --ss-bg: #1d3352; --fw-bg: #1c3a2a; --sms-bg: #2e2850; --bad-bg: #4a2124; --warn-bg: #45381a; --heat: 57 135 229; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #12161d; --card: #1a2029; --ink: #e8edf4; --ink-2: #a7b2c2; --rule: #2e3745; --accent: #6ea2ec;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --sms: #9085e9;
  --ss-bg: #1d3352; --fw-bg: #1c3a2a; --sms-bg: #2e2850; --bad-bg: #4a2124; --warn-bg: #45381a; --heat: 57 135 229; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--paper); color: var(--ink); font: 14px/1.5 var(--body); }
header { position: sticky; top: 0; z-index: 5; background: var(--card); border-bottom: 1px solid var(--rule); }
.bar { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; padding: 12px max(16px, 3vw); }
.brand h1 { font: 600 20px/1.2 var(--display); margin: 0; letter-spacing: .01em; text-wrap: balance; }
.brand p { margin: 2px 0 0; color: var(--ink-2); font-size: 12px; }
.tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-left: auto; }
button, .sel { font: inherit; border-radius: 6px; border: 1px solid var(--rule); background: var(--card); color: var(--ink); padding: 6px 12px; cursor: pointer; }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
button:disabled { opacity: .45; cursor: default; }
button:focus-visible, .sel:focus-visible, .tab:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.ref { display: flex; gap: 6px; align-items: center; font-size: 12px; color: var(--ink-2); }
.ref input { font: inherit; padding: 5px 8px; border: 1px solid var(--rule); border-radius: 6px; background: var(--card); color: var(--ink); }
nav#tabs { display: flex; gap: 2px; overflow-x: auto; padding: 0 max(16px, 3vw); }
.tab { border: 0; border-bottom: 3px solid transparent; border-radius: 0; background: none; padding: 10px 14px; color: var(--ink-2); font-weight: 500; white-space: nowrap; }
.tab.on { color: var(--ink); border-bottom-color: var(--accent); }
.meta { padding: 8px max(16px, 3vw) 0; color: var(--ink-2); font-size: 12px; }
.status { margin: 8px max(16px, 3vw) 0; padding: 8px 12px; border-radius: 6px; font-size: 13px; background: var(--ss-bg); }
.status.err { background: var(--bad-bg); } .status.warn { background: var(--warn-bg); } .status.ok { background: var(--fw-bg); }
main { padding: 12px max(16px, 3vw) 48px; display: grid; gap: 16px; }
#drop { margin: 24px max(16px, 3vw); border: 2px dashed var(--rule); border-radius: 12px; padding: 48px 24px; text-align: center; background: var(--card); }
#drop h2 { font: 600 22px var(--display); margin: 0 0 8px; }
#drop p { color: var(--ink-2); max-width: 60ch; margin: 0 auto; }
body.dragging #drop, body.dragging main { outline: 3px dashed var(--accent); outline-offset: -8px; }
.card { background: var(--card); border: 1px solid var(--rule); border-radius: 10px; padding: 16px; min-width: 0; }
.card h2 { font: 600 16px/1.3 var(--display); margin: 0 0 10px; text-wrap: balance; }
.card.lead p { margin: 0; font-size: 15px; max-width: 110ch; }
.note { color: var(--ink-2); font-size: 12px; margin: -4px 0 10px; max-width: 120ch; }
.two { display: grid; grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); gap: 16px; }
@media (max-width: 480px) { .two { grid-template-columns: 1fr; } }
.kpis { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; }
.kpi { background: var(--card); border: 1px solid var(--rule); border-left: 4px solid var(--rule); border-radius: 8px; padding: 10px 12px; display: grid; gap: 2px; }
.kpi-good { border-left-color: var(--good); } .kpi-warning { border-left-color: var(--warning); } .kpi-serious { border-left-color: var(--serious); } .kpi-critical { border-left-color: var(--critical); }
.kl { font-size: 12px; color: var(--ink-2); }
.kv { font: 600 24px/1.2 var(--display); font-variant-numeric: tabular-nums; }
.kc { font-size: 12px; color: var(--ink-2); font-variant-numeric: tabular-nums; } .kc span { opacity: .85; }
.chip { justify-self: start; font-size: 11px; font-weight: 600; padding: 1px 8px; border-radius: 999px; margin-top: 4px; }
.chip-good { background: var(--fw-bg); color: var(--good); } .chip-warning { background: var(--warn-bg); color: var(--warning); } .chip-serious { background: var(--bad-bg); color: var(--serious); } .chip-critical { background: var(--bad-bg); color: var(--critical); }
.find { margin: 0; padding-left: 0; list-style: none; display: grid; gap: 8px; max-width: 120ch; }
.find li { padding-left: 12px; border-left: 3px solid var(--rule); }
.method { margin: 0; padding-left: 18px; display: grid; gap: 6px; max-width: 120ch; }
.tw { overflow-x: auto; max-width: 100%; }
table { border-collapse: collapse; width: 100%; font-size: 12.5px; font-variant-numeric: tabular-nums; }
th, td { border-bottom: 1px solid var(--rule); padding: 5px 8px; text-align: left; vertical-align: top; }
thead th { position: sticky; top: 0; background: var(--card); color: var(--ink-2); font-weight: 600; font-size: 12px; border-bottom: 2px solid var(--rule); white-space: nowrap; }
td.n { text-align: right; white-space: nowrap; } td.neg { color: var(--critical); font-weight: 600; } td.pos { color: var(--good); font-weight: 600; }
td.bad { background: var(--bad-bg); } td.warn { background: var(--warn-bg); }
td.lv-crit { background: var(--bad-bg); color: var(--critical); font-weight: 600; } td.lv-high { background: var(--bad-bg); } td.lv-watch, td.lv-nofac { background: var(--warn-bg); }
table.heatmap td.heat { background: rgb(var(--heat) / calc(var(--h) * .55)); }
table.gantt td, table.jgrid td { font-size: 10.5px; text-align: center; white-space: nowrap; border: 1px solid var(--rule); padding: 3px 4px; }
table.gantt th, table.jgrid th { font-size: 11px; white-space: nowrap; }
.g-ok { background: var(--ss-bg); } .g-crit { background: var(--bad-bg); color: var(--critical); font-weight: 600; } .g-high { background: var(--warn-bg); } .g-sms { background: var(--sms-bg); } .g-empty { color: var(--ink-2); }
.j-ss { background: var(--ss-bg); font-weight: 600; } .j-fw { background: var(--fw-bg); font-weight: 600; } .j-sms { background: var(--sms-bg); font-weight: 600; } .j-ot { background: var(--rule); }
.j-tent { color: var(--critical); }
.ch { position: relative; height: 260px; }
.cmpsel { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 10px; font-size: 13px; }
.muted { color: var(--ink-2); font-size: 12px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="brand"><h1 id="appTitle">Báo cáo điều hành APIC</h1><p id="appSub">Tự động từ file PLANTABLE</p></div>
    <div class="tools">
      <label class="ref" for="refInput"><span id="lblRef">Ngày tham chiếu</span><input type="date" id="refInput"></label>
      <button type="button" id="btnUpload" class="primary">Tải file PLANTABLE</button>
      <button type="button" id="btnExcel" hidden>Tải Excel</button>
      <button type="button" id="btnLang">日本語</button>
      <input type="file" id="file" accept=".xlsm,.xlsx" hidden>
    </div>
  </div>
  <nav id="tabs" aria-label="Tabs"></nav>
</header>
<div class="meta" id="meta"></div>
<div class="status" id="status" hidden></div>
<section id="drop" hidden><h2 id="dropTitle">Thả file PLANTABLE (.xlsm) vào đây</h2><p id="dropHint"></p></section>
<main id="main"></main>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
<script src="engine.js"></script>
<script src="i18n.js"></script>
<script src="app.js"></script>
</body>
</html>
